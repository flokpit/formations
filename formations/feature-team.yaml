apiVersion: formations/v1alpha1
kind: Formation
name: feature-team
description: Implements a feature that spans several modules; an architect designs and splits the work, developers build in parallel, an independent reviewer and an optional tester verify.
status: proposal
shape: orchestrator-workers-verifier

integration_branch: "feature/{flock}"   # reviewed work items meet here, so one item can build on another without a human merge in between

lead:
  breed: architect
  op: true                      # v1 leftover, ignored by flokpit v2

lead_commands: [fly, land, kick, honk]   # flokpit v2 grants for the lead: fly its members, land and kick them, land the flock
member_commands: [honk]

members:
  - breed: developer
    count: { min: 1, max: 4 }
    start: on_demand            # one per module or work item, spawned by the lead
  - breed: reviewer
    count: { min: 1, max: 1 }
    start: with_flock
  - breed: tester
    count: { min: 0, max: 1 }
    start: on_demand            # only when the feature has a user interface
  - breed: devops
    count: { min: 0, max: 1 }
    start: on_demand            # only when the feature needs pipeline, build or packaging changes
  - breed: tech-writer
    count: { min: 0, max: 1 }
    start: on_demand            # only when the feature changes what users or operators read
  - breed: consultant
    count: { min: 0, max: 1 }
    start: on_demand            # the watchdog brings one in for a troubled member
  - breed: pr-checker
    count: { min: 0, max: 2 }
    start: on_roost             # risk rating and integration tests on every PR of the feature
  - breed: watchdog
    count: { min: 0, max: 1 }
    start: on_roost
  - breed: resumer
    count: { min: 0, max: 1 }
    start: on_roost

spawn_tree:
  architect: [developer, reviewer, tester, devops, tech-writer]
  watchdog: [consultant, developer, reviewer, tester, devops, tech-writer]
  resumer: [developer, reviewer, tester, pr-checker, devops, tech-writer]

roosts:                         # created by /fly in the flock channel, removed by /land
  - { name: watchdog, breed: watchdog, preset: quarter-hour }
  - { name: resumer,  breed: resumer,  preset: budget-reset }
  - name: pr-checker
    breed: pr-checker
    preset: pr-opened-or-updated
    filter:
      event_detail_filter:
        github.event_detail.repo: "{repo}"
        github.event_detail.head_ref: "flokpit/*"   # the flock's own branches only

work_split: |
  Design first: read how the project is run (`mise tasks`, else its AGENTS.md
  or CLAUDE.md) and write an ADR for the feature with the options considered and
  the chosen one. Then split by module or bounded context, never by job
  title: one work item per developer, each with acceptance criteria that can
  be checked by running something. Every pull request is opened against
  {integration_branch}; after the reviewer approved it and its checks are
  green, its author merges it into {integration_branch}. An item that builds
  on another starts when that one is merged there; say the order in the plan.
  Spawn a developer per item, at most four at a time. When every item is
  verified, open one pull request from {integration_branch} to the default
  branch: merging that one is the humans' decision.

handoffs:
  architect: { deliver: ADR PR and one issue per work item with acceptance criteria, to: developer }
  developer:          { deliver: "PR against {integration_branch} with passing tests and the issue it closes; merged into it by the author after approval", to: reviewer }
  devops:             { deliver: "PR against {integration_branch} with green checks", to: reviewer }
  tech-writer:        { deliver: "PR against {integration_branch} with the documentation of the feature", to: reviewer }
  reviewer:           { deliver: "submitted PR review: approve or request changes", to: architect }
  tester:          { deliver: test report with screenshots and a PR with e2e tests, to: architect }

state:
  kind: github-issues
  label: "flock:{flock}"
  progress_file: PROGRESS.md    # on the lead's branch; chat is coordination, not the record

verification:
  required: [reviewer-approved, ci-green, acceptance-criteria-checked]
  optional: [tester-passed]
  verifier_is_not_author: true

termination:
  conditions:
    - all_items_verified          # every issue closed by an approved, green PR merged into the integration branch
    - human_stop
    - no_progress_rounds: 3       # three lead check-ins without a newly verified item
    - limits_reached
  summary: Feature summary with links to the ADR, all PRs and their review state, the pull request from the integration branch to the default branch, open risks, and what a human must merge.

limits:
  max_agents: 14                # lead + 4 developers + reviewer + tester + devops + tech-writer + consultant + 2 pr-checkers + watchdog + resumer
  max_lifetime: 8h
  max_budget_usd: 0
  turn_budget: 40

channel:
  create: true
  name: "#{flock}"
  topic: "feature-team: {task}"
  modes: [n, t, M]

escalate_to_human:
  - merge_to_default_branch
  - scope_change
  - architecture_decision_with_no_clear_winner
  - budget_or_lifetime_extension
  - same_item_failed_review_twice

kickoff: |
  Post the task as you understood it and the acceptance criteria you derived,
  with intent QUESTION if anything is unclear; wait for an answer before
  designing. Check with `git ls-remote origin {integration_branch}` that the
  branch exists; if not, the first developer you spawn creates it from the
  default branch and pushes it (you cannot). Then write the ADR, file the
  issues, spawn the developers and post the plan as a checklist. Tell every
  member that {integration_branch} is the base of its pull request.
