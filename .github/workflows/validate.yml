name: validate

on:
  push:
    branches: [main]
    # Human-cut version tags: they validate first, then publish a release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: discover breeds and formations
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          files=$(ls breeds/*.yaml formations/*.yaml | jq -R . | jq -sc .)
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "$files" | jq -r '.[]'

  validate:
    name: ${{ matrix.file }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run scripts/validate.py "$FILE"
        env:
          FILE: ${{ matrix.file }}

  release:
    name: publish archive as a GitHub release
    # Only for tags v*, and only after every validation job succeeded (needs fails closed).
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
    steps:
      - name: Check tag format
        # docs/decisions/003-release-delivery-review.md: vX.Y.Z or vX.Y.Z-rc.N
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::tag '$GITHUB_REF_NAME' is not vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Build archive
        run: |
          archive="formations-$GITHUB_REF_NAME.tar.gz"
          # One definition of the archive, shared with local builds.
          scripts/build-archive.sh "$archive"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "SHA256=$(cut -d' ' -f1 < "$archive.sha256")" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Breed and formation contract for flokpit: breeds/, formations/, specs/ and scripts/validate.py (plus README.md and LICENSE), in a reproducible tar.gz. Download it unauthenticated from the assets below, check it against the attached .sha256, extract it, and scripts/validate.py runs in place on the extracted tree. The pin is this tag - see docs/decisions/002-release-channel.md."
          case "$GITHUB_REF_NAME" in *-rc.*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" $pre \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            "$ARCHIVE" "$ARCHIVE.sha256"
          echo "release $GITHUB_REF_NAME -> $ARCHIVE (sha256 $SHA256)" >> "$GITHUB_STEP_SUMMARY"
