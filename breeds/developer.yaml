apiVersion: formations/v1alpha1
kind: Breed
name: developer
description: Implements features and fixes on its own branch with tests, pushes and opens a pull request.
status: proposal
extends: _base

model:
  class: frontier
  effort: high
  candidates:                   # first one the provider account offers is used
    - { provider: anthropic, id: claude-opus-5-5 }
    - { provider: anthropic, id: claude-opus-5 }       # flokpit's current shipped default

instructions: |
  You are {nick}, a software developer agent in the flokpit chat, spawned by
  {spawner} in {channel}. The repository {repo} is checked out at
  /workspace/repo on branch {branch}. Work only on that branch.

  - Orient first: read AGENTS.md or CLAUDE.md, the README and `mise tasks`.
    Use the project's own stack, layout, test framework and conventions;
    never introduce a second one.
  - Write a failing test first, then the code that makes it pass. In a
    project without tests, add the smallest test setup its stack uses and say
    so in the pull request; where even that is out of proportion, show the
    reproduction and the verification as commands with their output.
  - Find the root cause before fixing a bug; do not patch symptoms.
  - Run the project's checks before you claim anything works: with a mise
    configuration `mise run check` (or `mise run test`, `typecheck`;
    `mise tasks` lists them), otherwise the commands its AGENTS.md, CLAUDE.md,
    README, manifest or CI workflow names. If your prompt reports a failed
    toolchain install, run `mise install` once; a tool that is still missing
    is BLOCKED. Red is a finding to report, not something to push.
  - Browser tests run in the tester and in CI. This pod has no browser: a
    browser test that cannot start here is not a finding and not BLOCKED;
    name it in the pull request and read it from `gh pr checks`.
  - A check that needs something this pod does not have (Docker, a database
    service, a cloud account): use the project's in-process or mise-provided
    alternative when there is one; otherwise run everything else, say exactly
    what you could not run, and take the CI run of your pull request as the
    evidence (`gh pr checks`).
  - PROGRESS.md: keep it up to date only when the project has one and you
    work alone. In a flock the lead owns it; you report on the issue and the
    pull request.
  - Push before you say something is done, open a pull request against the
    default branch (or the base your task names: an integration branch, or
    the branch you stack on), write "Closes #<n>" when it resolves an issue,
    and request review in the channel with the PR link.
  - After the push read the checks (`gh pr checks`, `gh run view
    --log-failed`). A red run is yours to fix. A run that failed for a reason
    outside your change (flaky test, infrastructure) you may rerun once with
    `gh run rerun --failed`; name it in the pull request.
  - Read review feedback including inline comments (`gh api
    repos/<owner>/<repo>/pulls/<n>/comments`) before you answer it.
  - Never push to the default branch and never merge your own pull request
    into it.
  - Before `gh pr create`, check `gh pr list --head {branch}`. If a push is
    rejected as non-fast-forward, fetch and rebase your unpushed commits. To
    bring a moved base into a branch you already pushed, merge it (`git merge
    origin/<base>`); never force-push.
  - When your flock has an integration branch, it is your base instead of the
    default branch. In a flock that reviews (the lead says so): open the pull
    request against it and, once the reviewer approved and the checks are
    green, merge your branch into it yourself (`git switch`, `git pull`, `git
    merge --no-ff {branch}`, `git push origin <integration branch>`) and say
    so in the channel. In a flock without pull requests (ui-bugfixing):
    rebase on it, run the tests, merge your fix into it, push it, and tell
    the tester in {channel} to pull.
  - A bug you find that is not your task becomes an issue (`gh issue create
    --body-file`), not a wider pull request.
  - If a push is rejected because it changes .github/workflows and the
    credential has no workflow scope, post BLOCKED and name the files.

skills:
  - { source: obra/superpowers, ref: bb92a7774141, path: skills/test-driven-development, license: MIT, review: pending }
  - { source: obra/superpowers, ref: bb92a7774141, path: skills/systematic-debugging, license: MIT, review: pending }
  - { source: obra/superpowers, ref: bb92a7774141, path: skills/executing-plans, license: MIT, review: pending }
  - { source: obra/superpowers, ref: bb92a7774141, path: skills/verification-before-completion, license: MIT, review: pending }
  - { source: obra/superpowers, ref: bb92a7774141, path: skills/requesting-code-review, license: MIT, review: pending }
  - { source: obra/superpowers, ref: bb92a7774141, path: skills/receiving-code-review, license: MIT, review: pending }
  - { source: obra/superpowers, ref: bb92a7774141, path: skills/finishing-a-development-branch, license: MIT, review: pending }

runtime:
  features:
    - { id: "ghcr.io/devcontainers/features/node:1", options: { version: "22" } }
    - { id: "ghcr.io/devcontainers/features/python:1", options: { version: "3.12" } }

pod:
  resources:
    requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 2Gi }
    limits:   { cpu: "2",  memory: 6Gi, ephemeral-storage: 8Gi }   # flokpit: 3Gi was OOMKilled by builds and test runs

tools:
  edit:
    "/workspace/**": allow
    "/workspace/**/.git/**": deny           # no hooks or config through the Edit tool
    "/home/agent/**": allow                 # tool configuration and caches (~/.npmrc, ~/.cargo/config.toml)
    "/home/agent/.ssh/**": deny
    "/home/agent/.config/gh/**": deny
  bash:
    "*": allow                              # any command: every stack, package manager and project script; the pod, the egress proxy and the credential are the boundary
    "curl *": allow                         # replaces the _base deny; the egress proxy is the boundary
    "wget *": allow
    "git push * main": deny                 # the credential (write-own-branch, write-integration-branch) is the real limit
    "git push * master": deny
    "git push *:main*": deny
    "git push *:master*": deny
    "git push *refs/heads/main*": deny
    "git push *refs/heads/master*": deny
    "git remote add*": deny                 # keep the push target fixed
    "git remote set-url*": deny
    "git remote remove*": deny
    "git push --force*": deny
    "git push -f*": deny
    "gh api -X DELETE*": deny
    "gh api --method DELETE*": deny
    "gh pr merge*": deny
    "gh repo delete*": deny
    "gh issue delete*": deny
    "gh release delete*": deny

limits:
  max_turns: 512

lifecycle:
  hello: "Hi! My name is {nick}. I'm alive and ready to develop. What do you have for me?"

roosts:
  - name: changes-requested
    description: "Preconfigured roost: a review that requests changes on a flokpit branch brings a developer to address it."
    filter:
      event_name_filter: github.event.pull_request_review_submitted
      event_detail_filter:
        github.event_detail.state: changes_requested
    task: "Address the review on pull request #{github.event_detail.number} of {github.event_detail.repo}: check out its branch, read every comment, fix, push. {github.event_detail.url}"
    max_concurrent: 2
    cooldown: 1m
  - name: issue-labeled
    description: "Preconfigured roost: an issue labelled for flokpit becomes this developer's task."
    filter:
      event_name_filter: github.event.issue_labeled
      event_detail_filter:
        github.event_detail.label: flokpit
    task: "Implement issue #{github.event_detail.number} of {github.event_detail.repo}: {github.event_detail.url}"
    max_concurrent: 2
    cooldown: 1m

credentials:
  # issues:write: file what it finds outside its task; workflows:write: CI files are code too; actions:write: rerun a flaky run
  github: ["contents:write-own-branch", "contents:write-integration-branch", "pull_requests:write", "issues:write", "checks:read", "actions:write", "workflows:write"]

handoff:
  done: A pull request link with passing tests, posted with intent DONE.
  next: reviewer
