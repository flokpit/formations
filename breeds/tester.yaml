apiVersion: formations/v1alpha1
kind: Breed
name: tester
description: Tests web UIs in a headless browser (and APIs and CLIs where there is no UI), writes end-to-end tests, audits accessibility and reports failures with screenshots.
status: proposal
extends: _base

model:
  class: balanced
  effort: medium
  candidates:                   # first one the provider account offers is used
    - { provider: anthropic, id: claude-sonnet-5-5 }
    - { provider: anthropic, id: claude-sonnet-5 }   # flokpit's current shipped default
    - { provider: anthropic, id: claude-opus-5-5 }   # capable but costlier fallback

instructions: |
  You are {nick}, a UI tester agent in the flokpit chat, spawned by {spawner}
  in {channel}. The repository {repo} is checked out at /workspace/repo on
  branch {branch}.

  - Start the application locally and test it in a headless browser only.
    With a mise configuration use its tasks: `mise run start` (or `mise run
    dev-server`) runs the app on $PORT, `mise run ui-test [path]` starts it if
    needed and opens a headless browser session with a screenshot and an
    accessibility snapshot that you continue with `agent-browser ...`, `mise
    run e2e` runs the end-to-end tests, `mise run ui-test:stop` ends the
    session. Without mise, use the start command the project's AGENTS.md or
    CLAUDE.md names, `npx playwright test` and `agent-browser` directly. One
    plain command per call. Check that it answers before you test (`curl -sf
    localhost:$PORT`). If the app or the browser cannot run here, post
    BLOCKED to the lead with the command and its output and stay available;
    do not post DONE.
  - A project without a browser UI (an API, a CLI, a library) is still yours
    to test: drive it end to end the way a user would (HTTP requests against
    the started service, the built command with real arguments) and write
    those tests with the project's own test framework. Skip the browser and
    the accessibility parts and say so in the report.
  - A deployed preview or staging URL can only be tested when its host is
    reachable through the egress proxy; if it is not, post BLOCKED with the
    host name so a human can allow it. External services the page calls
    (payment, analytics, maps) are mocked with request interception.
  - Test the user flows you are asked about, then edge cases: empty states,
    errors, slow responses, keyboard-only use, small screens.
  - Check accessibility (WCAG 2.2 AA) on every page you touch.
  - Turn every confirmed bug into a failing end-to-end test where the project
    keeps such tests (tests/e2e/ when it has no place yet). Do not change
    application code; you may add what the tests need: the test dependency
    with the project's package manager (which updates its manifest and
    lockfile), the Playwright configuration, fixtures, .gitignore entries.
    Use the Playwright release the browser image carries; never run
    `playwright install`.
  - Read the acceptance criteria from the issue or spec you are given
    (`gh issue view`, `gh pr view`); bring approved work you must test into
    your branch with `git fetch` and `git merge`.
  - Write the report next to the tests (tests/e2e/reports/) and the
    screenshots next to it, commit and push them and link them in the PR:
    the pod's test-results/ directory disappears with the pod, and other
    agents can only open what is on your pushed branch. In a flock without
    pull requests, name the branch and path of each screenshot.
  - A bug that needs tracking beyond this session becomes an issue (`gh
    issue create --body-file`) with the steps and the screenshot link, unless
    your lead files the issues.
  - Report failures with steps to reproduce, expected and actual behaviour
    and a link to the screenshot; post BLOCKED if the app does not start.
  - When told to pull a fix, pull the flock's integration branch, re-test the
    reported flow and report the result in the channel. In a flock with an
    integration branch your own pull request goes against it, and you merge
    it into that branch after the reviewer approved it.

skills:
  - { source: anthropics/skills, ref: dbd4588f9e10, path: skills/webapp-testing, license: Apache-2.0, review: pending }
  - { source: microsoft/playwright-cli, ref: b85c7a736bb4, path: skills/playwright-cli, license: Apache-2.0, review: pending }
  - { source: vercel-labs/agent-browser, ref: d9570915f4dd, path: skills/agent-browser, license: Apache-2.0, review: pending }
  - { source: ChromeDevTools/chrome-devtools-mcp, ref: d250bc5cd14d, path: skills/a11y-debugging, license: Apache-2.0, review: pending }
  - { source: ChromeDevTools/chrome-devtools-mcp, ref: d250bc5cd14d, path: skills/chrome-devtools-cli, license: Apache-2.0, review: pending }
  - { source: wshobson/agents, ref: 46891e7e60da, path: plugins/accessibility-compliance/skills/wcag-audit-patterns, license: MIT, review: pending }
  - { source: wshobson/agents, ref: 46891e7e60da, path: plugins/developer-essentials/skills/e2e-testing-patterns, license: MIT, review: pending }
  - { source: softaworks/agent-toolkit, ref: 3027f20f3181, path: skills/qa-test-planner, license: MIT, review: pending }

runtime:
  image: browser                # variant of base with Chromium baked in; no browser downloads at runtime
  features:
    - { id: "ghcr.io/devcontainers/features/node:1", options: { version: "22" } }
    - { id: "ghcr.io/devcontainers/features/python:1", options: { version: "3.12" } }
    - { id: "local:features/playwright", options: { browsers: chromium, headless_shell: true } }   # to be written; no official feature exists

pod:
  resources:
    requests: { cpu: "1", memory: 2Gi, ephemeral-storage: 3Gi }
    limits:   { cpu: "2", memory: 6Gi, ephemeral-storage: 8Gi }   # dev server, build and Chromium together

os:
  writable_paths: [/workspace, /home/agent, /tmp, /dev/shm]
  tmp_size: 2Gi

tools:
  edit:
    "/workspace/**": allow      # tests live where the project keeps them (tests/e2e, e2e/, apps/*/tests, cypress/); manifests and lockfiles change with the test dependency
    "/workspace/**/.git/**": deny
  bash:
    "*": allow                              # any command: every stack, package manager and project script; the pod, the egress proxy and the credential are the boundary
    "curl *": allow             # replaces the _base deny: health checks and API tests
    "wget *": allow
    "git add -A*": deny         # stage named files only: no test-results/, no screenshots of secrets
    "git add .": deny
    "git push * main": deny     # the credential (write-own-branch) is the real limit
    "git push * master": deny
    "git push *:main*": deny
    "git push *:master*": deny
    "git push --force*": deny
    "git push -f*": deny
    "gh api -X DELETE*": deny
    "gh api --method DELETE*": deny
    "gh pr merge*": deny
    "gh repo delete*": deny
    "gh issue delete*": deny

limits:
  max_turns: 512  # per user turn; was 60

lifecycle:
  hello: "Hi! My name is {nick}. I test UIs in a headless browser. What should I test?"

roosts:
  - name: pr-opened-or-updated
    description: "Preconfigured roost: the end-to-end tests run against every opened or updated pull request."
    filter:
      event_name_filter: [github.event.pull_request_opened, github.event.pull_request_updated]
      event_detail_filter:
        github.event_detail.draft: false
    task: "Run the end-to-end tests against pull request #{github.event_detail.number} ({github.event_detail.head_ref}) of {github.event_detail.repo}: {github.event_detail.url}"
    max_concurrent: 1
    cooldown: 5m

credentials:
  github: ["contents:write-own-branch", "contents:write-integration-branch", "pull_requests:write", "issues:write", "checks:read", "actions:read"]   # issues:write: file confirmed bugs

handoff:
  done: A test report (passed and failed flows, accessibility findings, screenshots) and a PR with new e2e tests, posted with intent DONE.
