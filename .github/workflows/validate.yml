name: validate

on:
  push:
    branches: [main]
    # Human-cut version tags: they validate first, then publish a release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: discover breeds and formations
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          files=$(ls breeds/*.yaml formations/*.yaml | jq -R . | jq -sc .)
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "$files" | jq -r '.[]'

  validate:
    name: ${{ matrix.file }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run scripts/validate.py "$FILE"
        env:
          FILE: ${{ matrix.file }}

  release:
    name: publish archive as a GitHub release
    # Only for tags v*, and only after every validation job succeeded (needs fails closed).
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
    steps:
      - name: Check tag format
        # docs/decisions/003-release-delivery-review.md: vX.Y.Z or vX.Y.Z-rc.N
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::tag '$GITHUB_REF_NAME' is not vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Build archive
        run: |
          archive="formations-$GITHUB_REF_NAME.tar.gz"
          # Same script as the bunny.net job: one definition of the archive.
          scripts/build-archive.sh "$archive"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "SHA256=$(cut -d' ' -f1 < "$archive.sha256")" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Breed and formation contract for flokpit: breeds/, formations/, specs/ and scripts/validate.py (plus README.md and LICENSE), in a reproducible tar.gz. Download it unauthenticated from the assets below, check it against the attached .sha256, extract it, and scripts/validate.py runs in place on the extracted tree. The pin is this tag - see docs/decisions/002-release-channel.md."
          case "$GITHUB_REF_NAME" in *-rc.*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" $pre \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            "$ARCHIVE" "$ARCHIVE.sha256"
          echo "release $GITHUB_REF_NAME -> $ARCHIVE (sha256 $SHA256)" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish archive to bunny.net (deprecated)
    # DEPRECATED: GitHub Releases (job `release` above) are the public channel
    # since docs/decisions/002-release-channel.md. This upload is kept live
    # only until the last consumer has moved to a release tag; remove the job
    # and the two repository secrets then.
    # Only for main, and only after every validation job succeeded (needs fails closed).
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Uploads run one at a time in push order, so LATEST is never overwritten by an older commit.
    concurrency:
      group: publish-main
      cancel-in-progress: false
    env:
      BUNNY_STORAGE_HOST: storage.bunnycdn.com   # region of the storage zone (Falkenstein)
      BUNNY_ZONE: ${{ secrets.FORMATIONS_BUNNY_BUCKET_NAME }}
      BUNNY_KEY: ${{ secrets.FORMATIONS_BUNNY_BUCKET_WRITE_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Build archive
        run: |
          short=$(git rev-parse --short HEAD)
          archive="$short.tar.gz"
          # Same script as the release job: one definition of the archive
          # (README.md, LICENSE, breeds, formations, specs, scripts/validate.py; reproducible).
          scripts/build-archive.sh "$archive"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "SHA256=$(cut -d' ' -f1 < "$archive.sha256")" >> "$GITHUB_ENV"

      - name: Upload archive
        run: |
          curl --fail-with-body -sS -X PUT \
            -H "AccessKey: $BUNNY_KEY" \
            -H "Content-Type: application/octet-stream" \
            -H "Checksum: ${SHA256^^}" \
            --data-binary "@$ARCHIVE" \
            "https://$BUNNY_STORAGE_HOST/$BUNNY_ZONE/$ARCHIVE"

      - name: Verify archive
        run: |
          curl --fail -sS -H "AccessKey: $BUNNY_KEY" -o downloaded.tar.gz \
            "https://$BUNNY_STORAGE_HOST/$BUNNY_ZONE/$ARCHIVE"
          echo "$SHA256  downloaded.tar.gz" | sha256sum -c -

      - name: Update LATEST
        # Only after the archive is uploaded and verified, so LATEST never points to a missing file.
        run: |
          printf '%s' "$ARCHIVE" > LATEST
          curl --fail-with-body -sS -X PUT \
            -H "AccessKey: $BUNNY_KEY" \
            -H "Content-Type: text/plain" \
            --data-binary @LATEST \
            "https://$BUNNY_STORAGE_HOST/$BUNNY_ZONE/LATEST"
          test "$(curl --fail -sS -H "AccessKey: $BUNNY_KEY" "https://$BUNNY_STORAGE_HOST/$BUNNY_ZONE/LATEST")" = "$ARCHIVE"
          echo "LATEST -> $ARCHIVE (sha256 $SHA256)" >> "$GITHUB_STEP_SUMMARY"
